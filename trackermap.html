<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask the campaign data: SIA Tracker prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EE; --panel:#F7F9F8; --ink:#17262B; --muted:#56676C; --rule:#CBD4D1;
  --land:#D6DED9; --land-other:#E4E8E6; --border:#F7F9F8;
  --done:#2E7D6B; --prog:#3B6FB6; --plan:#8A949A; --late:#D49A1B; --verylate:#B5402F; --det:#7A3E9D;
  --focus:#3B6FB6; --chip:#E1E7E4;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A1C; --panel:#182225; --ink:#E2EAE7; --muted:#9AABA8; --rule:#2C3A3D;
    --land:#26353A; --land-other:#1C2729; --border:#121A1C;
    --done:#4FB39A; --prog:#6E9BE0; --plan:#7E8B90; --late:#E6B341; --verylate:#E06A55; --det:#B983D8;
    --focus:#6E9BE0; --chip:#22302F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A1C; --panel:#182225; --ink:#E2EAE7; --muted:#9AABA8; --rule:#2C3A3D;
  --land:#26353A; --land-other:#1C2729; --border:#121A1C;
  --done:#4FB39A; --prog:#6E9BE0; --plan:#7E8B90; --late:#E6B341; --verylate:#E06A55; --det:#B983D8;
  --focus:#6E9BE0; --chip:#22302F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(320px,410px) 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.head{padding:20px 22px 14px}
.head h1{font-size:22px;line-height:1.2;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em}
.proto{font-size:13px;color:var(--muted);margin:0}
.proto strong{color:var(--verylate);font-weight:600}
.ask{padding:0 22px 14px}
.ask form{display:flex;gap:8px}
.ask input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg)}
.ask button[type=submit]{padding:10px 14px;border:0;border-radius:6px;background:var(--ink);color:var(--panel);font-weight:600;cursor:pointer}
.sugg{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.sugg button{text-align:left;background:none;border:0;padding:6px 8px;margin:0 -8px;border-radius:5px;color:var(--prog);cursor:pointer;font-size:14px}
.sugg button:hover{background:var(--chip)}
.sugg button[aria-pressed=true]{background:var(--chip);color:var(--ink);font-weight:600}
.answer{border-top:1px solid var(--rule);padding:16px 22px 22px;overflow:auto;flex:1;min-height:0}
.answer .q{font-weight:600;margin:0 0 8px}
.answer p{margin:0 0 10px}
.answer .muted{color:var(--muted);font-size:13px}
.bars{margin:6px 0 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.bars .bar{height:8px;border-radius:2px;background:var(--verylate)}
.recs{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.recs li{border-bottom:1px solid var(--rule)}
.recs button{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;padding:9px 4px;cursor:pointer;font-size:13.5px}
.recs button:hover,.recs button.on{background:var(--chip)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.recs .t{font-weight:600}
.recs .s{grid-column:2/4;color:var(--muted)}
.recs .r{color:var(--muted);font-variant-numeric:tabular-nums}
.thinking{color:var(--muted)}
main{position:relative;min-height:0;overflow:hidden}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map:active{cursor:grabbing}
.country{fill:var(--land-other);stroke:var(--border);stroke-width:.6}
.country.af{fill:var(--land)}
.camp{stroke:var(--border);stroke-width:1.2;cursor:pointer;transition:opacity .25s}
.camp.dim{opacity:.13}
.camp.sel{stroke:var(--ink);stroke-width:2.5}
.det{fill:none;stroke:var(--det);stroke-width:2;pointer-events:none}
.det.hot{stroke-width:3}
.legend{position:absolute;left:16px;bottom:16px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:12.5px;max-width:calc(100% - 32px)}
.legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto auto;gap:4px 14px}
.legend li{display:flex;align-items:center;gap:6px}
.legend label{display:flex;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--rule);cursor:pointer}
.ring{width:11px;height:11px;border-radius:50%;border:2px solid var(--det)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:13px;width:260px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none;z-index:5}
.tip h3{margin:0 0 4px;font-size:14px}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0}
.tip dt{color:var(--muted)}
.tip dd{margin:0}
.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.zoom button{border:0;background:none;width:34px;height:34px;cursor:pointer;font-size:17px}
.zoom button+button{border-top:1px solid var(--rule)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 60vh;height:auto}
  aside{border-right:0;border-bottom:1px solid var(--rule)}
  .answer{max-height:none;overflow:visible}
  main{height:60vh;order:2}
}
@media (prefers-reduced-motion:reduce){.camp{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="head">
    <h1>Ask the campaign data</h1>
    <p class="proto"><strong>Prototype.</strong> Illustrative records shaped like the SIA Campaign Tracker, not real WHO data. Answers are scripted for the demo.</p>
  </div>
  <div class="ask">
    <form id="f">
      <label for="qin" class="visually-hidden" style="position:absolute;left:-9999px">Ask a question</label>
      <input id="qin" placeholder="Ask about campaigns, delays or RAs" autocomplete="off">
      <button type="submit">Ask</button>
    </form>
    <div class="sugg" id="sugg"></div>
  </div>
  <div class="answer" id="ans" aria-live="polite"></div>
</aside>
<main>
  <svg id="map" role="img" aria-label="Map of nOPV2 campaigns in Africa and Yemen"></svg>
  <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view" style="font-size:13px">⤢</button></div>
  <div class="legend" id="legend"></div>
  <div class="tip" id="tip"></div>
</main>
</div>

ican Rep.","area":"Bangui","lat":4.51,"lon":18.375,"date":"2026-08-19","source":"Environmental sample"},{"id":"DET-KEN-016","iso":"KEN","country":"Kenya","area":"Garissa","lat":-0.393,"lon":39.419,"date":"2026-09-04","source":"Environmental sample"}]};
const TODAY=new Date('2026-10-15');
const recs=DATA.recs, dets=DATA.det;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function color(r){ if(r.status==='Completed')return 'var(--done)'; if(r.status==='In progress')return 'var(--prog)'; if(r.status==='Planned')return 'var(--plan)'; return r.delay>30?'var(--verylate)':'var(--late)'; }
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+' million':Math.round(n/1e3)+',000';
const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const daysAgo=s=>Math.round((TODAY-new Date(s))/864e5);

// legend
document.getElementById('legend').innerHTML=`<ul>
<li><span class="dot" style="background:var(--done);margin:0"></span>Completed</li>
<li><span class="dot" style="background:var(--prog);margin:0"></span>In progress</li>
<li><span class="dot" style="background:var(--plan);margin:0"></span>Planned</li>
<li><span class="dot" style="background:var(--late);margin:0"></span>Delayed up to 30 days</li>
<li><span class="dot" style="background:var(--verylate);margin:0"></span>Delayed over 30 days</li>
</ul><label><input type="checkbox" id="dettog"><span class="ring"></span>Detections, last 90 days (POLIS, phase 2, simulated)</label>`;

// map
const svg=d3.select('#map'), g=svg.append('g');
const proj=d3.geoMercator(), path=d3.geoPath(proj);
const af={type:'FeatureCollection',features:BASE.features.filter(f=>f.properties.af)};
let W,H;
const countries=g.append('g').selectAll('path').data(BASE.features).join('path').attr('class',d=>'country'+(d.properties.af?' af':''));
const detG=g.append('g'), campG=g.append('g');
const camps=campG.selectAll('circle').data(recs).join('circle').attr('class','camp').attr('fill',color)
  .attr('tabindex',0).attr('role','button').attr('aria-label',d=>`${d.id}, ${d.area}, ${d.country}, ${d.status}`);
const detc=detG.selectAll('circle').data(dets).join('circle').attr('class','det').style('display','none');
const zoom=d3.zoom().scaleExtent([1,12]).on('zoom',e=>{g.attr('transform',e.transform);const k=e.transform.k;
  camps.attr('r',d=>rad(d)/Math.sqrt(k)).style('stroke-width',1.2/k); detc.attr('r',9/Math.sqrt(k)).style('stroke-width',2/k);});
svg.call(zoom);
const rad=d=>3.5+Math.sqrt(d.target/1e5)*1.1;
function layout(){
  const b=svg.node().getBoundingClientRect(); W=b.width;H=b.height;
  proj.fitExtent([[20,20],[W-20,H-20]],af);
  countries.attr('d',path);
  camps.attr('cx',d=>proj([d.lon,d.lat])[0]).attr('cy',d=>proj([d.lon,d.lat])[1]).attr('r',rad);
  detc.attr('cx',d=>proj([d.lon,d.lat])[0]).attr('cy',d=>proj([d.lon,d.lat])[1]).attr('r',9);
}
layout(); window.addEventListener('resize',()=>{layout();svg.call(zoom.transform,d3.zoomIdentity)});
document.getElementById('zin').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.6);
document.getElementById('zout').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6);
document.getElementById('zreset').onclick=()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function zoomTo(list){
  if(!list.length){svg.transition().duration(reduce?0:600).call(zoom.transform,d3.zoomIdentity);return;}
  const pts=list.map(d=>proj([d.lon,d.lat])); const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  let [x0,x1,y0,y1]=[Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)];
  const pad=60, k=Math.min(8,0.85/Math.max((x1-x0+pad)/W,(y1-y0+pad)/H));
  const t=d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(1,k)).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(reduce?0:750).call(zoom.transform,t);
}

// tooltip
const tip=document.getElementById('tip');
function showTip(d,x,y){
  const late=d.delay?`${d.delay} days`:'None';
  tip.innerHTML=`<h3>${d.area}, ${d.country}</h3><div class="muted" style="color:var(--muted)">${d.id} · nOPV2 ${d.round}</div>
  <dl><dt>Status</dt><dd>${d.status}</dd><dt>Planned start</dt><dd>${fmtD(d.planned)}</dd>
  ${d.delay?`<dt>Revised start</dt><dd>${fmtD(d.revised)}</dd>`:''}<dt>Delay</dt><dd>${late}</dd>
  ${d.reason?`<dt>Reason</dt><dd>${d.reason}</dd>`:''}<dt>Target</dt><dd>${fmtN(d.target)} children</dd>
  <dt>RA</dt><dd>${d.ra} (${d.ra_status==='Pending'?'awaiting '+d.gate+', '+d.ra_wait+' days':'approved'})</dd></dl>`;
  tip.style.display='block';
  const m=document.querySelector('main').getBoundingClientRect();
  let left=x-m.left+14, top=y-m.top+14;
  if(left+270>m.width) left=x-m.left-274; if(top+tip.offsetHeight>m.height) top=Math.max(8,m.height-tip.offsetHeight-8);
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
camps.on('mouseenter',(e,d)=>showTip(d,e.clientX,e.clientY)).on('mouseleave',()=>tip.style.display='none')
  .on('click',(e,d)=>{select(d.id);showTip(d,e.clientX,e.clientY)})
  .on('focus',function(e,d){const b=this.getBoundingClientRect();showTip(d,b.right,b.bottom)}).on('blur',()=>tip.style.display='none');
function select(id){
  camps.classed('sel',d=>d.id===id);
  document.querySelectorAll('.recs button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
}

// questions
const lakeChad=r=>['NER','TCD','CMR'].includes(r.iso)||(r.iso==='NGA'&&['Borno','Yobe'].includes(r.area));
function tally(list,key){const m={};list.forEach(r=>m[r[key]]=(m[r[key]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function barsHTML(t){const max=t[0]?t[0][1]:1;return `<div class="bars">${t.map(([k,v])=>`<span>${k}</span><span class="bar" style="width:${v/max*100}%"></span><span>${v}</span>`).join('')}</div>`;}
const sum=l=>l.reduce((a,r)=>a+r.target,0);
const Q=[
 {q:'Which campaigns are delayed more than 30 days, and why?',kw:/delay|late|behind|slip/i,run(){
   const l=recs.filter(r=>r.status==='Delayed'&&r.delay>30).sort((a,b)=>b.delay-a.delay);
   return {list:l,html:`<p><strong>${l.length} campaigns</strong> are more than 30 days behind their planned start, covering about ${fmtN(sum(l))} target children. The longest is ${l[0].area}, ${l[0].country} at ${l[0].delay} days.</p><p class="muted">Delay reasons</p>${barsHTML(tally(l,'reason'))}`};}},
 {q:'Show delayed campaigns in the Lake Chad Basin',kw:/lake chad|chad basin|basin/i,run(){
   const l=recs.filter(r=>lakeChad(r)&&r.status==='Delayed').sort((a,b)=>b.delay-a.delay);
   const sec=l.filter(r=>r.reason==='Security or access').length;
   return {list:l,html:`<p>In the Lake Chad Basin (Chad, Niger, northern Cameroon, and Borno and Yobe in Nigeria), <strong>${l.length} campaigns are delayed</strong>. ${sec} of them cite security or access.</p><p class="muted">By country</p>${barsHTML(tally(l,'country'))}`};}},
 {q:'Which risk assessments are waiting for sign-off?',kw:/\bra\b|ras\b|risk|approv|sign.?off|gate/i,run(){
   const l=recs.filter(r=>r.ra_status==='Pending').sort((a,b)=>b.ra_wait-a.ra_wait);
   return {list:l,sub:r=>`${r.ra} awaiting ${r.gate}, ${r.ra_wait} days`,html:`<p><strong>${l.length} campaigns</strong> are held up by a risk assessment that has not cleared every gate. The oldest has waited ${l[0].ra_wait} days at ${l[0].gate}.</p><p class="muted">Waiting at</p>${barsHTML(tally(l,'gate'))}`};}},
 {q:'Where were detections in the last 90 days without a response underway?',kw:/detect|outbreak|polis|cvdpv|case|surveil/i,run(){
   const active=new Set(recs.filter(r=>['Completed','In progress'].includes(r.status)).map(r=>r.iso+'|'+r.area));
   const gaps=dets.filter(d=>!active.has(d.iso+'|'+d.area));
   const gapAreas=new Set(gaps.map(d=>d.iso+'|'+d.area));
   const l=recs.filter(r=>gapAreas.has(r.iso+'|'+r.area));
   return {list:l,det:gaps,html:`<p><strong>${gaps.length} of ${dets.length} detections</strong> in the last 90 days are in areas with no completed or ongoing campaign. ${l.filter(r=>r.status==='Delayed').length} of the campaigns planned for those areas are delayed.</p><p class="muted">This answer joins surveillance with campaign data, which needs POLIS access (phase 2). Detections here are simulated.</p>`};}},
 {q:'What finished in the last 30 days?',kw:/complet|finish|done|ended/i,run(){
   const l=recs.filter(r=>r.status==='Completed'&&daysAgo(r.revised)<=30&&daysAgo(r.revised)>=0).sort((a,b)=>b.revised.localeCompare(a.revised));
   return {list:l,sub:r=>`Started ${fmtD(r.revised)}`,html:`<p><strong>${l.length} campaigns</strong> completed with a start date in the last 30 days, reaching a target of about ${fmtN(sum(l))} children.</p>`};}},
];
const sugg=document.getElementById('sugg');
Q.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x.q;b.onclick=()=>ask(i);sugg.appendChild(b)});
const ans=document.getElementById('ans'), dettog=document.getElementById('dettog');
function showDet(on,hot){detc.style('display',d=>on&&(!hot||hot.includes(d))?null:'none').classed('hot',d=>!!hot&&hot.includes(d));dettog.checked=on;}
dettog.onchange=()=>showDet(dettog.checked);
function ask(i,text){
  [...sugg.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  const qtext=text||Q[i].q;
  ans.innerHTML=`<p class="q">${qtext}</p><p class="thinking">Querying tracker records…</p>`;
  setTimeout(()=>{
    const r=Q[i].run(); const ids=new Set(r.list.map(d=>d.id));
    camps.classed('dim',d=>!ids.has(d.id)).classed('sel',false);
    showDet(!!r.det, r.det);
    const sub=r.sub||(d=>d.delay?`${d.status}, ${d.delay} days${d.reason?' · '+d.reason:''}`:d.status);
    ans.innerHTML=`<p class="q">${qtext}</p>${r.html}<p class="muted">Source records (${r.list.length})</p><ul class="recs">${r.list.map(d=>
      `<li><button data-id="${d.id}"><span class="dot" style="background:${color(d)}"></span><span class="t">${d.area}, ${d.country}</span><span class="r">${d.id}</span><span class="s">${sub(d)}</span></button></li>`).join('')}</ul>`;
    ans.querySelectorAll('.recs button').forEach(b=>b.onclick=()=>{const d=recs.find(x=>x.id===b.dataset.id);select(d.id);zoomTo([d]);
      setTimeout(()=>{const c=camps.filter(x=>x.id===d.id).node().getBoundingClientRect();showTip(d,c.right,c.bottom)},reduce?0:780);});
    zoomTo(r.det?[...r.list,...r.det]:r.list);
  },reduce?0:650);
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=document.getElementById('qin').value.trim();if(!t)return;
  const i=Q.findIndex(x=>x.kw.test(t));
  if(i<0){[...sugg.children].forEach(b=>b.setAttribute('aria-pressed',false));
    ans.innerHTML=`<p class="q">${t.replace(/</g,'&lt;')}</p><p>This prototype answers the five suggested questions. In the pilot, the assistant would query the tracker database directly and answer any question about campaigns, delays and risk assessments.</p>`;return;}
  ask(i,t.replace(/</g,'&lt;'));};
ask(0);
</script>
